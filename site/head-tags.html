<!-- ═══════════════════════════════════════════════════════════════════════
     TokenHUD — tokenhud.com
     The complete discovery tag set: SEO (rank), GEO (be cited by AI answer
     engines), AEO (be the answer). Every tag below is here for a reason
     stated above it; anything a search engine has publicly said it ignores
     is listed at the bottom as deliberately omitted, so nobody re-adds it.
     ═══════════════════════════════════════════════════════════════════ -->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ── SEO: the two tags that still carry real weight ────────────────────
     Title: ~55 chars so it is not truncated in results. Primary term first,
     brand last. Description: ~155 chars — it does not affect ranking, but it
     is the copy a human reads before deciding to click. -->
<title>TokenHUD — Live Token Usage & Cost for Claude Code</title>
<meta name="description" content="See what your AI coding agents are running and costing, live on your own machine. Token metering, spend and plan limits for Claude Code. Free, local-first, zero dependencies.">

<!-- One canonical URL, or the homepage competes with its own README and
     docs for the same query. -->
<link rel="canonical" href="https://tokenhud.com/">

<!-- ── GEO: freshness and provenance ────────────────────────────────────
     Answer engines weight recency and prefer a named, attributable source.
     Keep dateModified accurate — a stale date is worse than none. -->
<meta name="author" content="TokenHUD">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

<!-- ── Open Graph — link previews on Slack, Discord, LinkedIn, iMessage ──
     og:image must be an absolute URL and should be 1200x630. A relative
     path silently produces no preview at all, which is the usual bug. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="TokenHUD">
<meta property="og:url" content="https://tokenhud.com/">
<meta property="og:title" content="TokenHUD — a heads-up display for the AI agents on your machine">
<meta property="og:description" content="Live token spend, session metering and plan limits for Claude Code. Metrics leave, content never does.">
<meta property="og:image" content="https://tokenhud.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The TokenHUD dashboard showing token spend, session metering and five-hour plan usage.">
<meta property="og:locale" content="en_US">

<!-- ── X / Twitter ──────────────────────────────────────────────────────
     summary_large_image is the only card type worth using for a product. -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="TokenHUD — a heads-up display for the AI agents on your machine">
<meta name="twitter:description" content="Live token spend, session metering and plan limits for Claude Code. Metrics leave, content never does.">
<meta name="twitter:image" content="https://tokenhud.com/og.png">
<meta name="twitter:image:alt" content="The TokenHUD dashboard showing token spend and plan usage.">

<!-- ── Browser chrome ───────────────────────────────────────────────────
     Two theme-colors so the mobile address bar matches the page in both
     schemes rather than flashing white on a dark page. -->
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- ── Performance: only what is actually used ──────────────────────────
     preconnect costs a connection; only list an origin the page really
     hits. Remove these if the page ends up fully self-hosted. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- ═══ DELIBERATELY OMITTED, so nobody helpfully adds them back ═══
     <meta name="keywords">        Google has ignored this since 2009.
     <meta name="revisit-after">   Never supported by any major engine.
     <meta name="rating">          No effect.
     <meta name="generator">       Tells an attacker your stack, buys nothing.
     rel="shortlink", DC.* Dublin Core, geo.position — no consumer.
     Anything claiming to be an "AI meta tag" for LLM ranking: there is no
     such standard. Citability comes from the content and the structured
     data below, not from a tag asserting it.
     ═════════════════════════════════════════════════════════════════ -->
