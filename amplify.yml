# AWS Amplify Hosting — full-stack deploy of the portal.
#
# The backend phase deploys amplify/ (Cognito auth, the Machine table, the
# ingest function and its public URL) and writes amplify_outputs.json at the
# repo root. The frontend phase builds the Vite app in site/, which imports
# that outputs file to find the user pool, the data API and the ingest URL.
# Custom headers live in customHttp.yml beside this file.
version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 22
        - npm install
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - cd site && npm install
    build:
      commands:
        - cd site && npm run build
  artifacts:
    baseDirectory: site/dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
